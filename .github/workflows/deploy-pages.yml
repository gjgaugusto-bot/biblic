name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar sintaxe JavaScript
        run: |
          node --check app.js
          node --check editorial-review.js
          node --check study-data.js
          node --check book-art.js
          node --check scripts/validate-site.mjs
          node --check scripts/browser-smoke.mjs
      - name: Validar estrutura e cobertura dos dados
        run: node scripts/validate-site.mjs
      - name: Instalar ferramentas de teste em navegador
        run: npm install --no-save --package-lock=false playwright@1.64.1 @axe-core/playwright@4.14.0
      - name: Instalar Chromium para testes
        run: npx playwright install --with-deps chromium
      - name: Iniciar servidor local do site
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/biblic-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/biblic-http.log
          exit 1
      - name: Testar navegação, edição, backups e acessibilidade
        run: node scripts/browser-smoke.mjs

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
