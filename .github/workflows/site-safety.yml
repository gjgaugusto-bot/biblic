name: Proteção do site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar espelho automático de segurança
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git push origin HEAD:refs/heads/backup-automatico --force

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar sintaxe JavaScript
        run: |
          node --check app.js
          node --check study-data.js

      - name: Verificar arquivos essenciais e carregamento
        run: |
          test -s index.html
          test -s style.css
          test -s app.js
          test -s study-data.js
          grep -q 'study-data.js' index.html
          grep -q 'app.js' index.html
