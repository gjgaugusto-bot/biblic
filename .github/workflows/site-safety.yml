name: Proteção do site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar sintaxe JavaScript
        run: |
          node --check app.js
          node --check study-data.js
          node --check scripts/validate-site.mjs
      - name: Validar estrutura do site
        run: node scripts/validate-site.mjs

  mirror:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Atualizar espelho de segurança após validação
        run: git push origin HEAD:refs/heads/backup-automatico --force
